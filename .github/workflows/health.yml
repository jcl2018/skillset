# Written by workflow-health (automation.py). It reads .loop/config.json.
name: health
on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      on: ${{ steps.routine.outputs.on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the routine
        id: routine
        env:
          EVENT: ${{ github.event_name }}
        run: |
          cron=$(python3 -c 'import json; print(json.load(open(".loop/config.json")).get("health_cron") or "")' 2>/dev/null || true)
          if [ "$cron" = off ] && [ "$EVENT" = schedule ]; then  # off stops the schedule; a run started by hand still runs
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "OFF: health is off in .loop/config.json (health_cron), so this run writes nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -f skills/workflow-health/scripts/health.py ]; then
            echo "MISSING: the workflow-health skill is not in this repo's checkout, so health ran nothing and wrote nothing. Fix: commit the skills/ folder, or set health_cron to off." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "on=true" >> "$GITHUB_OUTPUT"
          if [ -n "$cron" ] && [ "$cron" != "47 */4 * * *" ]; then
            said="SCHEDULE: this workflow runs on '47 */4 * * *' but .loop/config.json says '$cron'. Fix: python3 skills/workflow-health/scripts/automation.py workflow"
            echo "::warning::$said"; echo "$said" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f skills/workflow-health/scripts/automation.py ]; then  # a workflow older than the skills says so on every run
            checked=$(python3 skills/workflow-health/scripts/automation.py workflow --check 2>&1) || printf '%s\n' "$checked" | while IFS= read -r said; do
              echo "::warning::$said"; echo "$said" >> "$GITHUB_STEP_SUMMARY"; done
          fi
      - name: Fetch the newest full-suite time
        if: steps.routine.outputs.on == 'true'
        continue-on-error: true  # no artifact yet: health says the time is unknown
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$(git rev-parse --git-common-dir)/loop"; got=$(mktemp -d); mkdir -p "$dir"
          for id in $(gh run list --workflow regression.yml --limit 20 --json databaseId -q '.[].databaseId' 2>/dev/null); do
            case "$id" in ''|*[!0-9]*) continue ;; esac  # a run number, never anything else
            gh run download "$id" --name suite-time --dir "$got" >/dev/null 2>&1 && break
          done
          if [ -s "$got/suite-time.tsv" ]; then  # the regression run's line, marked ci for cost.py
            awk -F'\t' 'NF >= 4 && $2 == "full" && $3 ~ /^[0-9]+$/ { print $1 "\t" $2 "\t" $3 "\t" $4 "\tci" }' "$got/suite-time.tsv" >> "$dir/suite-times.tsv"
            echo "SUITE_TIME: the newest regression run's full-suite time is in $dir/suite-times.tsv"
          else
            echo "NOTE: no suite-time artifact from the regression workflow yet; health shows the full-suite time as unknown"
          fi
      - name: Health check
        if: steps.routine.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}  # finding-age reads the open issues
        run: |
          python3 skills/workflow-health/scripts/health.py check --group requirements,traceability,consistency,docs,freshness,tests,security,size,adoption > "$RUNNER_TEMP/health-report.txt" 2>&1 || true
          { echo "## Health"; echo; echo '```'; cat "$RUNNER_TEMP/health-report.txt"; echo '```'; echo
            echo "Not run here: performance, Mine and hygiene read this machine's run records, branches and private files, which a runner doesn't have."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: File the findings as tagged issues
        if: always() && steps.routine.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 skills/workflow-health/scripts/health.py file --group requirements,traceability,consistency,docs,freshness,tests,security,size,adoption
      - name: Judge, only with the agent key secret
        if: always() && steps.routine.outputs.on == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # the judge reads this name, whatever the secret is called
        run: |
          set -o pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "JUDGE: skipped, no ANTHROPIC_API_KEY secret is set." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          setup=$(python3 -c 'import json; print(json.load(open(".loop/config.json")).get("judge_setup") or "")')
          [ -z "$setup" ] || env -u ANTHROPIC_API_KEY sh -c "$setup"
          prog=$(python3 -c 'import json; c = json.load(open(".loop/config.json")).get("judge_command"); print(c[0] if isinstance(c, list) and c else "")')
          if [ -z "$prog" ] || ! command -v "$prog" >/dev/null; then
            echo "JUDGE: skipped, the runner has no ${prog:-judge_command}; set judge_setup in .loop/config.json." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          { echo "## Judge"; echo; echo '```'; python3 skills/workflow-health/scripts/health.py judge 2>&1 | sed -n '/^JUDGE/,$p' || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"  # a red verdict is the report's, not the step's
      - name: Post the digest
        if: always() && steps.routine.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_REPORT: ${{ runner.temp }}/health-report.txt
          DIGEST_RUN: ${{ github.run_id }}
          DIGEST_REPO_OWNER: ${{ github.repository_owner }}
          MAIL_ADDR_SET: ${{ secrets.DIGEST_TO != '' && secrets.DIGEST_FROM != '' }}  # true or false, never a value
          MAIL_CF_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_EMAIL_TOKEN != '' }}
          MAIL_SMTP_SET: ${{ secrets.DIGEST_SMTP_USER != '' && secrets.DIGEST_SMTP_PASSWORD != '' }}
        run: python3 skills/workflow-health/scripts/automation.py digest
  mail:
    needs: health
    if: always() && needs.health.outputs.on == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Email the digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_RUN: ${{ github.run_id }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_TOKEN }}
          DIGEST_SMTP_USER: ${{ secrets.DIGEST_SMTP_USER }}
          DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
        run: python3 skills/workflow-health/scripts/mail.py send
